name: 🚦 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 🔍 ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: format
            run: npm run format:check
          - label: types
            run: npm run check
          - label: tests
            run: npm test
          - label: build
            run: npm run build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.run }}

  image:
    name: 🐋 image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: color-code-convertor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Serve it and see if it answers
        run: |
          docker run -d --name ci -p 8080:8080 color-code-convertor:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
              echo "up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          docker logs ci
          exit 1

  summary:
    name: ✅ CI
    runs-on: ubuntu-latest
    needs: [check, image]
    if: always()
    steps:
      - name: Write the summary
        env:
          CHECKS: ${{ needs.check.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| checks | $CHECKS |"
            echo "| image | $IMAGE |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$CHECKS" = "success" ] && [ "$IMAGE" = "success" ]
